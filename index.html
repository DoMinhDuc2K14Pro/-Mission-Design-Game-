<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Mission Control - 9 Solar Missions & Interactive Landing</title>
    <style>
        :root {
            --bg-dark: #030712;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --nasa-blue: #0284c7;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --text-glow: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #020617;
            border-bottom: 2px solid #1e293b;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            font-size: 1.1rem;
            color: var(--text-glow);
            letter-spacing: 2px;
        }

        .system-time {
            font-size: 0.85rem;
            color: var(--accent-amber);
        }

        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            flex: 1;
            background: radial-gradient(circle at center, #090d16 0%, #020617 100%);
            cursor: crosshair;
        }

        .mission-sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 2px solid #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        .panel-box {
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.4);
        }

        .panel-box h3 {
            font-size: 0.9rem;
            color: var(--accent-amber);
            margin-bottom: 10px;
            border-bottom: 1px dashed #334155;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .metric-val {
            color: var(--text-glow);
            font-weight: bold;
        }

        .planet-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 6px;
        }

        .planet-img-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--text-glow);
            font-size: 1.8rem;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .planet-details h4 {
            color: var(--accent-amber);
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .planet-details p {
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.3;
        }

        .btn-launch {
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
            color: white;
            border: 1px solid var(--text-glow);
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            transition: 0.2s;
            margin-bottom: 8px;
        }

        .btn-launch:hover {
            background: #0369a1;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* Modal Khảo Sát Bề Mặt */
        #landingModal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 620px;
            background: rgba(11, 61, 145, 0.98);
            border: 3px solid var(--text-glow);
            border-radius: 16px;
            padding: 20px;
            z-index: 50;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        #landingModal h2 {
            color: var(--accent-amber);
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .view-screen {
            position: relative;
            width: 100%;
            height: 160px;
            background: #020617;
            border: 2px solid #334155;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        #astronautCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Khung hiển thị ảnh chụp thực tế hành tinh */
        #photoDisplay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: none;
            z-index: 5;
            border-radius: 6px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 10px;
            padding: 10px;
            color: white;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .action-btn span {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent-amber);
        }

        .action-btn:hover {
            background: #0284c7;
            transform: scale(1.05);
        }

        #actionStatus {
            font-size: 0.9rem;
            color: #22c55e;
            height: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span style="font-size: 1.2rem;">🛰️</span>
            <h1>NASA MISSION CONTROL - 9 SOLAR MISSIONS</h1>
        </div>
        <div class="system-time" id="sysTime">SYS_TIME: 00:00:00</div>
    </header>

    <div class="main-container">
        <div class="mission-sidebar">
            <div class="panel-box">
                <h3>📊 THÔNG SỐ</h3>
                <div class="metric-row">
                    <span>Level:</span>
                    <span class="metric-val" id="levelVal">1 / 9</span>
                </div>
                <div class="metric-row">
                    <span>Khoảng cách:</span>
                    <span class="metric-val" id="distanceVal">0 mét</span>
                </div>
                <div class="metric-row">
                    <span>Thiên thạch phá hủy:</span>
                    <span class="metric-val" id="scoreVal">0</span>
                </div>
            </div>

            <div class="panel-box">
                <h3>🪐 MỤC TIÊU</h3>
                <div class="planet-card">
                    <div class="planet-img-container" id="planetEmoji">☀️</div>
                    <div class="planet-details">
                        <h4 id="planetName">Mặt Trời (Sun)</h4>
                        <p id="planetDesc">Nguồn năng lượng chính.</p>
                    </div>
                </div>
            </div>

            <div class="panel-box">
                <h3>⚙️ ĐIỀU KHIỂN</h3>
                <button class="btn-launch" onclick="toggleMission()">⏸️ DỪNG / ▶️ CHẠY</button>
                <button class="btn-launch" style="background: linear-gradient(135deg, #16a34a, #15803d);" onclick="forceLand()">🛬 XUỐNG XE</button>
            </div>
        </div>

        <canvas id="missionCanvas"></canvas>
    </div>

    <!-- MODAL KHẢO SÁT BỀ MẶT -->
    <div id="landingModal">
        <h2 id="modalTitle">🌕 Đã Hạ Cánh Khảo Sát!</h2>
        
        <div class="view-screen">
            <canvas id="astronautCanvas"></canvas>
            <div id="photoDisplay"></div>
        </div>
        
        <div id="actionStatus">Bấm các nút chức năng phía dưới để khám phá!</div>

        <div class="action-grid">
            <button class="action-btn" onclick="doAction('photo')">📸<span>CHỤP ẢNH</span></button>
            <button class="action-btn" onclick="doAction('rock')">🧪<span>LẤY MẪU</span></button>
            <button class="action-btn" onclick="doAction('temp')">🌡️<span>ĐO NHIỆT ĐỘ</span></button>
        </div>

        <button class="btn-launch" onclick="resumeFlight()">🚀 BAY TIẾP HÀNH TINH TIẾP THEO</button>
    </div>

    <script>
        const canvas = document.getElementById('missionCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth - 360;
            canvas.height = window.innerHeight - 50;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        setInterval(() => {
            const now = new Date();
            document.getElementById('sysTime').innerText = `SYS_TIME: ${now.toTimeString().split(' ')[0]}`;
        }, 1000);

        const missionPlanets = [
            { level: 1, name: "Mặt Trời", eng: "Sun", emoji: "☀️", color1: "#fde047", color2: "#ea580c", distanceThreshold: 0, temp: "+5500°C", sample: "Lõi Plasma năng lượng cao", img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=600" },
            { level: 2, name: "Sao Thủy", eng: "Mercury", emoji: "☿️", color1: "#cbd5e1", color2: "#475569", distanceThreshold: 1500, temp: "+430°C", sample: "Đất đá thiên thạch khô cằn", img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=600" },
            { level: 3, name: "Sao Kim", eng: "Venus", emoji: "♀️", color1: "#fde047", color2: "#ca8a04", distanceThreshold: 3200, temp: "+465°C", sample: "Khoáng chất axit sulfuric", img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=600" },
            { level: 4, name: "Trái Đất", eng: "Earth", emoji: "🌍", color1: "#38bdf8", color2: "#1d4ed8", distanceThreshold: 5200, temp: "+15°C", sample: "Mẫu đất màu mỡ & nước sạch", img: "https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=600" },
            { level: 5, name: "Sao Hỏa", eng: "Mars", emoji: "🔴", color1: "#f87171", color2: "#b91c1c", distanceThreshold: 7800, temp: "-60°C", sample: "Đất đỏ oxit sắt (Bụi đỏ)", img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=600" },
            { level: 6, name: "Sao Mộc", eng: "Jupiter", emoji: "🟠", color1: "#fb923c", color2: "#c2410c", distanceThreshold: 11000, temp: "-110°C", sample: "Mẫu khí hydro nén đặc", img: "https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=600" },
            { level: 7, name: "Sao Thổ", eng: "Saturn", emoji: "🪐", color1: "#fef08a", color2: "#a16207", distanceThreshold: 15000, temp: "-140°C", sample: "Bụi băng và đá vành đai", img: "https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=600" },
            { level: 8, name: "Sao Thiên Vương", eng: "Uranus", emoji: "🌐", color1: "#7dd3fc", color2: "#0284c7", distanceThreshold: 19500, temp: "-195°C", sample: "Băng amoniac lạnh giá", img: "https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=600" },
            { level: 9, name: "Sao Hải Vương", eng: "Neptune", emoji: "🌊", color1: "#60a5fa", color2: "#1e40af", distanceThreshold: 25000, temp: "-200°C", sample: "Mẫu tinh thể băng metan", img: "https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=600" }
        ];

        let distanceMeters = 6932;
        let currentPlanetIdx = 3;
        let isRunning = true;
        let isLandingMode = false;
        let meteorsDestroyed = 2;
        let stars = [];
        let meteors = [];
        let lasers = [];

        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 2 + 0.5
            });
        }

        canvas.addEventListener('click', (e) => {
            if (!isRunning || isLandingMode) return;
            const rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            let shipX = 180;
            let shipY = canvas.height / 2;

            lasers.push({
                x: shipX + 35,
                y: shipY,
                targetX: mouseX,
                targetY: mouseY,
                speed: 15
            });
        });

        function toggleMission() {
            if (!isLandingMode) isRunning = !isRunning;
        }

        let astroAnimId = null;
        function forceLand() {
            isRunning = false;
            let p = missionPlanets[currentPlanetIdx];
            document.getElementById('modalTitle').innerText = `🌕 Level ${p.level}: Hạ Cánh ${p.name}!`;
            document.getElementById('actionStatus').innerText = "Bấm các nút chức năng phía dưới để khám phá!";
            document.getElementById('photoDisplay').style.display = "none";
            document.getElementById('landingModal').style.display = "block";
            startAstronautAnimation();
        }

        function resumeFlight() {
            document.getElementById('landingModal').style.display = "none";
            cancelAnimationFrame(astroAnimId);
            isRunning = true;
        }

        function doAction(type) {
            let p = missionPlanets[currentPlanetIdx];
            let photoDiv = document.getElementById('photoDisplay');
            
            if (type === 'photo') {
                photoDiv.style.backgroundImage = `url('${p.img}')`;
                photoDiv.style.display = "block";
                document.getElementById('actionStatus').innerText = `📸 Đã chụp ảnh bề mặt ${p.name}!`;
            } else if (type === 'rock') {
                photoDiv.style.display = "none";
                document.getElementById('actionStatus').innerText = `🧪 Đã lấy mẫu: ${p.sample}!`;
            } else if (type === 'temp') {
                photoDiv.style.display = "none";
                document.getElementById('actionStatus').innerText = `🌡️ Nhiệt độ bề mặt: ${p.temp}`;
            }
        }

        function startAstronautAnimation() {
            const aCanvas = document.getElementById('astronautCanvas');
            aCanvas.width = aCanvas.clientWidth;
            aCanvas.height = aCanvas.clientHeight;
            const aCtx = aCanvas.getContext('2d');
            
            let astroX = 40;
            let flagX = aCanvas.width - 70;

            function drawAstroScene() {
                aCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);

                aCtx.fillStyle = "#1e293b";
                aCtx.fillRect(0, aCanvas.height - 25, aCanvas.width, 25);

                aCtx.strokeStyle = "#cbd5e1";
                aCtx.lineWidth = 3;
                aCtx.beginPath();
                aCtx.moveTo(flagX, aCanvas.height - 25);
                aCtx.lineTo(flagX, aCanvas.height - 80);
                aCtx.stroke();

                aCtx.fillStyle = "#38bdf8";
                aCtx.fillRect(flagX, aCanvas.height - 80, 30, 20);

                if (astroX < flagX - 25) {
                    astroX += 1;
                }

                aCtx.fillStyle = "#f8fafc";
                aCtx.fillRect(astroX, aCanvas.height - 55, 14, 22);
                aCtx.fillStyle = "#f59e0b";
                aCtx.beginPath();
                aCtx.arc(astroX + 7, aCanvas.height - 61, 7, 0, Math.PI * 2);
                aCtx.fill();

                astroAnimId = requestAnimationFrame(drawAstroScene);
            }
            drawAstroScene();
        }

        function updateMission() {
            if (!isRunning || isLandingMode) return;

            distanceMeters += 2;

            if (Math.random() < 0.02) {
                meteors.push({
                    x: canvas.width + 50,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 20 + 15,
                    speed: Math.random() * 3 + 2
                });
            }

            meteors.forEach((m, index) => {
                m.x -= m.speed;
                let shipX = 180;
                let shipY = canvas.height / 2;
                let dist = Math.hypot(m.x - shipX, m.y - shipY);
                if (dist < m.size + 15) {
                    meteors.splice(index, 1);
                }
                if (m.x < -50) meteors.splice(index, 1);
            });

            lasers.forEach((l, lIdx) => {
                l.x += l.speed;
                meteors.forEach((m, mIdx) => {
                    let d = Math.hypot(l.x - m.x, l.y - m.y);
                    if (d < m.size) {
                        meteors.splice(mIdx, 1);
                        lasers.splice(lIdx, 1);
                        meteorsDestroyed++;
                        document.getElementById('scoreVal').innerText = meteorsDestroyed;
                    }
                });
                if (l.x > canvas.width) lasers.splice(lIdx, 1);
            });

            let nextIdx = currentPlanetIdx;
            for (let i = 0; i < missionPlanets.length; i++) {
                if (distanceMeters >= missionPlanets[i].distanceThreshold) {
                    nextIdx = i;
                }
            }

            if (nextIdx !== currentPlanetIdx) {
                currentPlanetIdx = nextIdx;
                updatePlanetUI();
                forceLand();
            }

            document.getElementById('distanceVal').innerText = `${distanceMeters} mét`;
            document.getElementById('levelVal').innerText = `${missionPlanets[currentPlanetIdx].level} / 9`;

            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = canvas.width;
            });
        }

        function updatePlanetUI() {
            let p = missionPlanets[currentPlanetIdx];
            document.getElementById('planetEmoji').innerText = p.emoji;
            document.getElementById('planetName').innerText = `${p.name} (${p.eng})`;
            document.getElementById('planetDesc').innerText = `Nhiệt độ: ${p.temp}`;
        }

        function drawPlanetGraphic(x, y, p) {
            ctx.save();
            
            let grad = ctx.createRadialGradient(x, y, 40, x, y, 75);
            grad.addColorStop(0, p.color1);
            grad.addColorStop(1, "transparent");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, 75, 0, Math.PI * 2);
            ctx.fill();

            if (p.level === 7) {
                ctx.strokeStyle = "rgba(253, 224, 71, 0.7)";
                ctx.lineWidth = 9;
                ctx.beginPath();
                ctx.ellipse(x, y, 90, 28, Math.PI / 6, 0, Math.PI * 2);
                ctx.stroke();
            }

            let planetGrad = ctx.createRadialGradient(x - 15, y - 15, 5, x, y, 55);
            planetGrad.addColorStop(0, p.color1);
            planetGrad.addColorStop(1, p.color2);
            
            ctx.fillStyle = planetGrad;
            ctx.beginPath();
            ctx.arc(x, y, 52, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f8fafc";
            ctx.font = "bold 15px Courier New";
            ctx.textAlign = "center";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#000";
            ctx.fillText(`Level ${p.level}: ${p.name}`, x, y - 90);

            ctx.restore();
        }

        function drawSpacecraft(x, y) {
            ctx.save();
            
            ctx.fillStyle = "#38bdf8";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#38bdf8";
            ctx.beginPath();
            ctx.moveTo(x - 30, y);
            ctx.lineTo(x - 55, y - 8);
            ctx.lineTo(x - 45, y);
            ctx.lineTo(x - 55, y + 8);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#cbd5e1";
            ctx.beginPath();
            ctx.moveTo(x + 35, y);
            ctx.lineTo(x - 10, y - 16);
            ctx.lineTo(x - 30, y - 10);
            ctx.lineTo(x - 35, y + 10);
            ctx.lineTo(x - 10, y + 16);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            ctx.moveTo(x + 35, y);
            ctx.lineTo(x + 15, y - 6);
            ctx.lineTo(x + 15, y + 6);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#64748b";
            ctx.beginPath();
            ctx.moveTo(x, y - 12);
            ctx.lineTo(x - 20, y - 32);
            ctx.lineTo(x - 28, y - 12);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x, y + 12);
            ctx.lineTo(x - 20, y + 32);
            ctx.lineTo(x - 28, y + 12);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#38bdf8";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#38bdf8";
            ctx.beginPath();
            ctx.ellipse(x + 5, y, 10, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            meteors.forEach(m => {
                ctx.fillStyle = "#64748b";
                ctx.strokeStyle = "#94a3b8";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            lasers.forEach(l => {
                ctx.strokeStyle = "#ef4444";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(l.x, l.y);
                ctx.lineTo(l.x + 15, l.y);
                ctx.stroke();
            });

            missionPlanets.forEach((p, idx) => {
                let planetScreenX = canvas.width - (distanceMeters - p.distanceThreshold) * 0.8 + (idx * 1600);
                let planetY = canvas.height / 3;

                if (planetScreenX > -200 && planetScreenX < canvas.width + 200) {
                    drawPlanetGraphic(planetScreenX, planetY, p);
                }
            });

            drawSpacecraft(180, canvas.height / 2);

            updateMission();
            requestAnimationFrame(draw);
        }

        updatePlanetUI();
        draw();
    </script>
</body>
</html>
